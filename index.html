<style>
  :root {
    /* Dark theme (default) */
    --bg: #0B1120;
    --bg-raised: #131C30;
    --bg-elevated: #1A2438;
    --text: #F4F6FB;
    --text-dim: #9AA5B8;
    --text-faint: #647089;
    --line: rgba(255,255,255,0.08);
    --accent: #3B82F6;
    --accent-2: #22D3AA;
    --accent-grad: linear-gradient(135deg, #3B82F6, #22D3AA);
    --urgent: #F0716B;
    --urgent-soft: rgba(240,113,107,0.14);
    --font-display: 'Source Serif 4', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.2), 0 4px 20px rgba(0,0,0,0.25);
    --shadow-raised: 0 12px 40px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
  html.light {
    --bg: #F7F9FC;
    --bg-raised: #FFFFFF;
    --bg-elevated: #FFFFFF;
    --text: #101728;
    --text-dim: #57617A;
    --text-faint: #8791A6;
    --line: #E4E8F0;
    --accent: #2563EB;
    --accent-2: #0EA37F;
    --accent-grad: linear-gradient(135deg, #2563EB, #0EA37F);
    --urgent: #D6403A;
    --urgent-soft: #FBE4E3;
    --shadow-card: 0 1px 2px rgba(16,23,40,0.05), 0 4px 16px rgba(16,23,40,0.06);
    --shadow-raised: 0 12px 40px rgba(16,23,40,0.14);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  /* Prevent grid/flex children from forcing horizontal overflow when they
     contain long unbreakable content (buttons, long words). Without this,
     CSS Grid/Flex items default to min-width:auto and can push wider than
     their track, cutting off content at the viewport edge on narrow screens. */
  .hero-inner > *, .details-body > *, .footer-grid > *, .field-row > *, .admin-shell > * {
    min-width: 0;
  }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    margin: 0; font-family: var(--font-body); color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    transition: background .35s ease, color .35s ease;
  }
  h1,h2,h3,h4 { font-family: var(--font-display); margin: 0; font-weight: 600; color: var(--text); line-height: 1.15; }
  p { margin: 0; line-height: 1.6; overflow-wrap: break-word; }
  a { color: inherit; text-decoration: none; }
  button { font-family: var(--font-body); cursor: pointer; }
  input, select, textarea { font-family: var(--font-body); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  img { max-width: 100%; display: block; }

  .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
  .mono { font-family: var(--font-mono); }
  @media (max-width: 480px) {
    .container { padding: 0 16px; }
    section.block { padding: 40px 16px; }
    .form-card { padding: 22px; }
  }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: 999px; font-weight: 600; font-size: 0.95rem; border: 1px solid transparent; transition: transform .18s cubic-bezier(.2,.8,.2,1), background .2s ease, border-color .2s ease, box-shadow .2s ease, opacity .2s ease; white-space: nowrap; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent-grad); color: #fff; box-shadow: 0 4px 18px rgba(59,130,246,0.35); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(59,130,246,0.45); }
  .btn-gold { background: var(--accent-grad); color: #fff; box-shadow: 0 4px 18px rgba(34,211,170,0.3); }
  .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(34,211,170,0.4); }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); background: rgba(59,130,246,0.08); }
  .btn-google { background: var(--bg-raised); border: 1px solid var(--line); color: var(--text); }
  .btn-google:hover { border-color: var(--text-faint); background: var(--bg-elevated); }
  .btn-danger { background: transparent; border-color: var(--urgent); color: var(--urgent); }
  .btn-danger:hover { background: var(--urgent-soft); }
  .btn-sm { padding: 8px 14px; font-size: 0.85rem; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

  .pill { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em; background: var(--bg); border: 1px solid var(--line); color: var(--text-dim); }
  .eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }

  /* ---- Header ---- */
  header.site { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); transition: background .35s ease, border-color .35s ease; }
  .nav-wrap { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: 1160px; margin: 0 auto; gap: 12px; }
  .nav-wrap > * { min-width: 0; }
  .brand { min-width: 0; overflow: hidden; }
  .brand-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--text); }
  .brand .mark { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand .mark img { width: 100%; height: 100%; object-fit: contain; }
  .brand .ai-tag { font-style: italic; font-weight: 700; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  nav.main-links { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  nav.main-links a, .nav-drop > button { padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.92rem; font-weight: 500; color: var(--text-dim); background: transparent; border: none; transition: color .15s ease, background .15s ease; }
  nav.main-links a:hover, nav.main-links a.active, .nav-drop > button:hover { color: var(--text); background: var(--bg-raised); }
  .nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .nav-drop { position: relative; }
  .nav-drop-menu { display: none; position: absolute; top: calc(100% + 6px); left: 0; background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-raised); min-width: 180px; padding: 6px; }
  .nav-drop.open .nav-drop-menu { display: block; animation: dropIn .18s ease; }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .nav-drop-menu a { display: block; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 0.88rem; color: var(--text-dim); }
  .nav-drop-menu a:hover { background: var(--bg); color: var(--text); }
  .menu-toggle { display: none; background: none; border: none; padding: 8px; color: var(--text); font-size: 1.1rem; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-dim); }
  .user-chip img { width: 28px; height: 28px; border-radius: 50%; }

  .theme-toggle {
    position: fixed; left: 20px; bottom: 20px; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg-raised); color: var(--text);
    box-shadow: var(--shadow-raised);
    transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .2s ease, background .2s ease;
  }
  .theme-toggle:hover { border-color: var(--accent); transform: rotate(-14deg) scale(1.05); }
  .theme-toggle svg { width: 20px; height: 20px; transition: opacity .2s ease, transform .4s ease; }
  .theme-toggle .icon-sun { display: none; }
  html.light .theme-toggle .icon-moon { display: none; }
  html.light .theme-toggle .icon-sun { display: block; }
  @media (max-width: 560px) {
    .theme-toggle { left: 14px; bottom: 14px; width: 42px; height: 42px; }
  }

  @media (max-width: 900px) {
    nav.main-links { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-raised); border-bottom: 1px solid var(--line); flex-direction: column; align-items: stretch; padding: 10px; box-shadow: var(--shadow-raised); max-height: 70vh; overflow-y: auto; }
    nav.main-links.open { display: flex; animation: dropIn .2s ease; }
    nav.main-links a, .nav-drop { width: 100%; }
    nav.main-links a, .nav-drop > button { width: 100%; text-align: left; }
    .nav-drop-menu { position: static; box-shadow: none; border: none; padding-left: 12px; }
    .menu-toggle { display: block; }
    .nav-right { gap: 6px; }
    .user-chip span { display: none; }
  }

  @media (max-width: 560px) {
    .nav-wrap { padding: 12px 14px; gap: 6px; }
    .brand { font-size: 0.98rem; gap: 6px; }
    .brand .mark { width: 28px; height: 28px; }
    .nav-right { gap: 6px; }
    .nav-right .btn { padding: 8px 12px; font-size: 0.78rem; }
  }

  @media (max-width: 380px) {
    .nav-wrap { padding: 10px 12px; }
    .brand { font-size: 0.88rem; }
    .brand .mark { width: 25px; height: 25px; }
    .menu-toggle { padding: 6px; font-size: 1rem; }
    .nav-right .btn { padding: 7px 10px; font-size: 0.72rem; }
  }

  /* ---- Hero ---- */
  .hero { padding: 64px 24px 56px; position: relative; overflow: hidden; }
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 85% 8%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 45%),
      radial-gradient(circle at 8% 92%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 40%);
  }
  .hero-inner { max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: center; }
  @media (max-width: 900px) { .hero-inner { grid-template-columns: 1fr; gap: 36px; } }
  .hero h1 { font-size: clamp(1.9rem, 4.2vw, 3.2rem); letter-spacing: -0.01em; animation: riseIn .6s cubic-bezier(.2,.8,.2,1) both; }
  .hero .lede { margin-top: 18px; font-size: clamp(0.95rem, 1.6vw, 1.08rem); color: var(--text-dim); max-width: 46ch; animation: riseIn .6s .08s cubic-bezier(.2,.8,.2,1) both; }
  .hero-cta { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; animation: riseIn .6s .16s cubic-bezier(.2,.8,.2,1) both; }
  @media (max-width: 480px) {
    .hero-cta { flex-direction: column; align-items: stretch; }
    .hero-cta .btn { width: 100%; }
  }
  .hero-stats { display: flex; gap: 32px; margin-top: 44px; flex-wrap: wrap; animation: riseIn .6s .24s cubic-bezier(.2,.8,.2,1) both; }
  .hero-stat .num { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 600; color: var(--text); background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-stat .label { font-size: 0.82rem; color: var(--text-faint); margin-top: 2px; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  /* Deadline clock visual — the hero thesis */
  .clock-panel { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 32px; color: var(--text); box-shadow: var(--shadow-raised); animation: riseIn .7s .1s cubic-bezier(.2,.8,.2,1) both; }
  .clock-panel .eyebrow { color: var(--accent-2); }
  .clock-list { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
  .clock-row { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); transition: transform .15s ease; }
  .clock-row::before { content: "✓"; color: var(--accent-2); font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
  .grad-text { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-style: italic; }
  .clock-row:hover { transform: translateX(3px); }
  .clock-row:last-child { border-bottom: none; padding-bottom: 0; }
  .clock-row .title { font-size: 0.92rem; font-weight: 500; flex: 1; color: var(--text); line-height: 1.4; }
  .clock-row .days { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent-2) 16%, transparent); color: var(--accent-2); white-space: nowrap; }
  .clock-row .days.soon { background: rgba(179,74,74,0.25); color: #f0b8b8; }

  /* ---- Section shells ---- */
  section.block { padding: 56px 24px; }
  .block-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
  .block-head h2 { font-size: 1.7rem; }
  .block-head .sub { color: var(--text-dim); margin-top: 6px; font-size: 0.95rem; }

  /* ---- Scholarship card (signature: deadline drain bar) ---- */
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card {
    position: relative; background: var(--bg-raised); border-radius: var(--radius-md);
    box-shadow: var(--shadow-card); overflow: hidden; padding: 22px 22px 22px 26px;
    display: flex; flex-direction: column; gap: 12px; transition: transform .15s ease, box-shadow .15s ease;
    border: 1px solid var(--line);
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-raised); }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: var(--line);
  }
  .card::after {
    content: ""; position: absolute; left: 0; bottom: 0; width: 5px;
    background: var(--accent); height: var(--fill, 40%);
    transition: height .3s ease;
  }
  .card.urgent::after { background: var(--urgent); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .card h3 { font-size: 1.12rem; line-height: 1.3; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 0.85rem; color: var(--text-dim); margin-top: 2px; }
  .card-meta span { display: flex; align-items: center; gap: 5px; }
  .card-deadline { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .card-deadline .date { font-family: var(--font-mono); font-size: 0.85rem; color: var(--text); }
  .card-deadline .days-left { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 600; color: var(--accent); }
  .card-deadline .days-left.soon { color: var(--urgent); }
  .card-link { position: absolute; inset: 0; }
  .grid-cards .card { animation: cardIn .45s cubic-bezier(.2,.8,.2,1) both; }
  .grid-cards .card:nth-child(1) { animation-delay: .02s; }
  .grid-cards .card:nth-child(2) { animation-delay: .06s; }
  .grid-cards .card:nth-child(3) { animation-delay: .10s; }
  .grid-cards .card:nth-child(4) { animation-delay: .14s; }
  .grid-cards .card:nth-child(5) { animation-delay: .18s; }
  .grid-cards .card:nth-child(6) { animation-delay: .22s; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty-state h3 { color: var(--text-dim); font-size: 1.1rem; margin-bottom: 8px; }
  .loading-state { text-align: center; padding: 60px 20px; color: var(--text-faint); font-family: var(--font-mono); font-size: 0.9rem; }

  /* ---- Filters / search ---- */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 26px; align-items: center; }
  .filter-bar select, .filter-bar input[type="text"] {
    padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--line);
    background: var(--bg-raised); font-size: 0.88rem; color: var(--text);
  }
  .filter-bar input[type="text"] { flex: 1; min-width: 200px; }
  .filter-chip { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-raised); font-size: 0.85rem; color: var(--text-dim); transition: all .15s ease; white-space: nowrap; }
  .filter-chip:hover { border-color: var(--accent); color: var(--text); }
  .filter-chip.active { background: var(--accent-grad); color: #fff; border-color: transparent; }
  @media (max-width: 560px) {
    .filter-bar { gap: 8px; }
    .filter-bar input[type="text"] { width: 100%; }
  }

  /* ---- Category tiles ---- */
  .grid-categories { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .cat-tile { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 22px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s ease, transform .15s ease; }
  .cat-tile:hover { border-color: var(--accent); transform: translateY(-2px); }
  .cat-tile .icon { width: 38px; height: 38px; border-radius: 9px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--text); }
  .cat-tile h3 { font-size: 1.05rem; }
  .cat-tile p { font-size: 0.85rem; color: var(--text-dim); }

  /* ---- Details page ---- */
  .details-hero { background: #0B1120; color: #F4F6FB; padding: 48px 24px; }
  .details-hero .container { max-width: 900px; }
  .details-hero h1 { color: #F4F6FB; font-size: clamp(1.5rem, 3.4vw, 2.3rem); }
  .details-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .details-badges .pill { background: rgba(244,246,251,0.1); border-color: rgba(244,246,251,0.2); color: #6EE7C8; }
  .details-meta-row { display: flex; flex-wrap: wrap; gap: 20px 28px; margin-top: 22px; }
  .details-meta-row .item .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(244,246,251,0.5); }
  .details-meta-row .item .value { font-family: var(--font-mono); font-size: 0.98rem; margin-top: 3px; color: #F4F6FB; }

  .details-body { max-width: 900px; margin: 0 auto; padding: 44px 24px 80px; display: grid; grid-template-columns: 1fr 300px; gap: 44px; }
  @media (max-width: 800px) { .details-body { grid-template-columns: 1fr; gap: 28px; } .details-side { position: static; } }
  .details-section { margin-bottom: 34px; }
  .details-section h2 { font-size: 1.15rem; margin-bottom: 12px; }
  .details-section p, .details-section li { color: var(--text-dim); font-size: 0.96rem; }
  .details-section ul { padding-left: 20px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .details-side { align-self: start; position: sticky; top: 90px; background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .details-side .btn { width: 100%; }
  .side-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .side-row:last-of-type { border-bottom: none; padding-bottom: 0; }
  .side-row .k { color: var(--text-faint); }
  .side-row .v { font-weight: 500; }

  /* ---- Footer ---- */
  footer.site { background: #0B1120; color: #F4F6FB; padding: 48px 24px 28px; margin-top: 40px; }
  .footer-grid { max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; }
  @media (max-width: 700px) { .footer-grid { grid-template-columns: 1fr; gap: 28px; } }
  footer.site h4 { color: #F4F6FB; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; font-family: var(--font-body); font-weight: 600; }
  footer.site .brand { color: #F4F6FB; }
  footer.site p.tag { color: rgba(244,246,251,0.6); font-size: 0.88rem; margin-top: 12px; max-width: 34ch; }
  footer.site ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 9px; }
  footer.site a { color: rgba(244,246,251,0.75); font-size: 0.9rem; transition: color .15s ease; }
  footer.site a:hover { color: var(--accent-2); }
  .footer-bottom { max-width: 1160px; margin: 36px auto 0; padding-top: 20px; border-top: 1px solid rgba(244,246,251,0.12); font-size: 0.8rem; color: rgba(244,246,251,0.5); }

  /* ---- Forms (contact / admin) ---- */
  .form-card { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 32px; max-width: 560px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .field label { font-size: 0.85rem; font-weight: 600; color: var(--text); }
  .field .hint { font-size: 0.78rem; color: var(--text-faint); }
  .field input, .field select, .field textarea {
    padding: 11px 13px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--bg); font-size: 0.92rem; color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 90px; font-family: var(--font-body); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }
  .form-msg { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 16px; }
  .form-msg.ok { background: #DFF0E0; color: #2C6E31; }
  .form-msg.err { background: var(--urgent-soft); color: var(--urgent); }

  /* ---- Admin ---- */
  .admin-shell { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 73px); }
  @media (max-width: 800px) { .admin-shell { grid-template-columns: 1fr; } }
  .admin-side { background: var(--bg-raised); border-right: 1px solid var(--line); padding: 24px 14px; display: flex; flex-direction: column; gap: 4px; }
  .admin-side button { display: block; width: 100%; text-align: left; padding: 10px 14px; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--text-dim); font-size: 0.9rem; transition: background .15s ease, color .15s ease; }
  .admin-side button.active, .admin-side button:hover { background: var(--accent-grad); color: #fff; }
  .admin-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-md); }
  .admin-main { padding: 32px 28px; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  table.admin-table { width: 100%; border-collapse: collapse; background: var(--bg-raised); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
  table.admin-table th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); padding: 12px 16px; border-bottom: 1px solid var(--line); }
  table.admin-table td { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 0.88rem; vertical-align: middle; }
  table.admin-table tr:last-child td { border-bottom: none; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.verified { background: #2C9E4A; }
  .status-dot.unverified { background: var(--text-faint); }
  .status-dot.draft { background: var(--accent); }
  .table-actions { display: flex; gap: 8px; }
  .table-actions button { background: none; border: none; color: var(--text-dim); font-size: 0.82rem; padding: 4px 8px; border-radius: 4px; }
  .table-actions button:hover { background: var(--bg); color: var(--text); }
  .table-actions button.danger:hover { color: var(--urgent); background: var(--urgent-soft); }

  .admin-login-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

  /* ---- Modal (sign-in page + auth gate popup) ---- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 300;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(4,8,20,0.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-card {
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 32px; width: 100%; max-width: 440px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.5);
    animation: modalPop .25s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes modalPop { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal-card .close-x {
    float: right; background: none; border: none; color: var(--text-faint); font-size: 1.3rem;
    line-height: 1; padding: 4px; margin: -4px -4px 0 0; border-radius: 6px;
  }
  .modal-card .close-x:hover { color: var(--text); background: var(--bg); }
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 18px; }
  .stat-card .num { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 600; color: var(--text); }
  .stat-card .label { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: 16px; height: 16px; }

  .page-fade { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .hidden { display: none !important; }

  /* ---- Splash / loading screen ---- */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0B1120;
    transition: opacity .6s cubic-bezier(.4,0,.2,1), visibility .6s;
  }
  #splash.splash-fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
  #splash .splash-logo {
    width: 120px; height: auto;
    animation: splashPulse 1.8s ease-in-out infinite;
    filter: drop-shadow(0 0 24px rgba(59,130,246,0.35));
  }
  @keyframes splashPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  #splash .splash-name {
    margin-top: 18px; font-family: var(--font-display); font-size: 1.4rem; font-weight: 700;
    color: #F4F6FB; letter-spacing: 0.01em;
    opacity: 0; animation: splashTextIn .5s .3s ease forwards;
  }
  @keyframes splashTextIn { to { opacity: 1; } }
  #splash .splash-bar-track {
    margin-top: 28px; width: 220px; height: 4px; border-radius: 999px;
    background: rgba(255,255,255,0.1); overflow: hidden;
  }
  #splash .splash-bar-fill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(135deg, #3B82F6, #22D3AA);
    transition: width 5s cubic-bezier(.4,0,.2,1);
  }
  #splash .splash-hint {
    margin-top: 14px; font-family: var(--font-mono); font-size: 0.72rem;
    letter-spacing: 0.06em; text-transform: uppercase; color: rgba(244,246,251,0.4);
  }
  #app { animation: appFadeIn .6s ease; }
  @keyframes appFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #splash .splash-logo { animation: none; }
  }
</style>
</head>

/* ---------------- Theme (dark default, persisted) ---------------- */
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('scholarix-theme'); } catch (e) {}
  if (saved === 'light') document.documentElement.classList.add('light');
}
function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light');
  try { localStorage.setItem('scholarix-theme', isLight ? 'light' : 'dark'); } catch (e) {}
}

const GATED_PATHS = ['scholarships', 'search', 'categories', 'about', 'contact'];
function isGatedPath(path) {
  if (GATED_PATHS.includes(path)) return true;
  if (path.startsWith('scholarship/')) return true;
  return false;
}

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const params = new URLSearchParams(qs || '');
  return { path: path || '', params };
}

window.addEventListener('hashchange', () => {
  state.route = parseHash();
  render();
  window.scrollTo(0, 0);
});

/* ---------------- Firestore live subscription ---------------- */
const q = query(collection(db, 'scholarships'), orderBy('createdAt', 'desc'));
onSnapshot(q, (snap) => {
  state.scholarships = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  state.scholarshipsLoaded = true;
  render();
}, (err) => {
  console.error('Firestore error', err);
  state.scholarshipsLoaded = true;
  state.scholarshipsError = err.message;
  render();
});

onAuthStateChanged(auth, (u) => {
  state.user = u;
  state.authLoading = false;
  render();
});

function isAdmin() {
  return !!state.user && ADMIN_EMAILS.includes((state.user.email || '').toLowerCase());
}

/* ---------------- Helpers ---------------- */
function esc(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toDate(val) {
  if (!val) return null;
  if (val.toDate) return val.toDate();
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}

function daysUntil(deadline) {
  const d = toDate(deadline);
  if (!d) return null;
  const end = new Date(d); end.setHours(23,59,59,999);
  return Math.ceil((end - Date.now()) / 86400000);
}

function formatDate(deadline) {
  const d = toDate(deadline);
  if (!d) return 'No deadline listed';
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function fillPercent(days) {
  if (days === null) return 40;
  if (days <= 0) return 100;
  if (days >= 90) return 8;
  return Math.round(100 - (days / 90) * 92);
}

function slugTitle(s) {
  return esc(s.title || 'Untitled scholarship');
}

/* ---------------- Scholarship card ---------------- */
function cardHtml(s) {
  const days = daysUntil(s.deadline);
  const urgent = days !== null && days <= 14 && days >= 0;
  const fill = fillPercent(days);
  let daysLabel = '';
  if (days === null) daysLabel = '';
  else if (days < 0) daysLabel = 'Closed';
  else if (days === 0) daysLabel = 'Closes today';
  else daysLabel = `${days}d left`;

  return `
  <div class="card ${urgent ? 'urgent' : ''}" style="--fill:${fill}%">
    <a class="card-link" href="#/scholarship/${s.id}" aria-label="${slugTitle(s)}"></a>
    <div class="card-top">
      <div class="card-badges">
        ${s.funding ? `<span class="pill">${esc(s.funding)}</span>` : ''}
        ${s.verified ? `<span class="pill" style="color:#2C9E4A;border-color:#bfe6c8;">Verified</span>` : ''}
      </div>
    </div>
    <h3>${slugTitle(s)}</h3>
    <div class="card-meta">
      ${s.country ? `<span>🌍 ${esc(s.country)}</span>` : ''}
      ${s.degree ? `<span>🎓 ${esc(s.degree)}</span>` : ''}
    </div>
    <div class="card-deadline">
      <span class="date mono">${formatDate(s.deadline)}</span>
      ${daysLabel ? `<span class="days-left ${urgent ? 'soon' : ''}">${daysLabel}</span>` : ''}
    </div>
  </div>`;
}

function cardsGrid(list) {
  if (!state.scholarshipsLoaded) {
    return `<div class="loading-state">Loading scholarships…</div>`;
  }
  if (state.scholarshipsError) {
    return `<div class="empty-state"><h3>Couldn't load scholarships</h3><p>${esc(state.scholarshipsError)}</p></div>`;
  }
  if (list.length === 0) {

  return `<div class="grid-cards">${list.map(cardHtml).join('')}</div>`;
}

function filterBar(params) {
  const degree = params.get('degree') || '';
  const funding = params.get('funding') || '';
  const closing = params.get('closing') || '';
  function chip(label, active, href) {
    return `<a href="${href}" class="filter-chip ${active ? 'active' : ''}">${label}</a>`;
  }
  const base = (overrides) => {
    const p = new URLSearchParams(params);
    Object.entries(overrides).forEach(([k,v]) => v ? p.set(k,v) : p.delete(k));
    const s = p.toString();
    return `#/scholarships${s ? '?' + s : ''}`;
  };
  return `
  <div class="filter-bar">
    ${chip('All', !degree && !funding && !closing, '#/scholarships')}
    ${DEGREES.map(d => chip(d, degree===d, base({degree: degree===d?'':d}))).join('')}
    ${FUNDING.map(f => chip(f, funding===f, base({funding: funding===f?'':f}))).join('')}
    ${chip('Closing Soon', closing==='soon', base({closing: closing==='soon'?'':'soon'}))}
  </div>`;
}

function filterList(list, params) {
  const degree = params.get('degree');
  const funding = params.get('funding');
  const closing = params.get('closing');
  const country = params.get('country');
  return list.filter(s => {
    if (degree && s.degree !== degree) return false;
    if (funding && s.funding !== funding) return false;
    if (country && s.country !== country) return false;
    if (closing === 'soon') {
      const d = daysUntil(s.deadline);
      if (d === null || d < 0 || d > 14) return false;
    }
    return true;
  });
}

  const { path } = state.route;
  if (path === '' ) return pageHome();
  if (path === 'scholarships') return pageScholarships();
  if (path === 'search') return pageSearch();
  if (path === 'categories') return pageCategories();
  if (path === 'about') return pageAbout();
  if (path === 'contact') return pageContact();
  if (path === 'signin') return pageSignIn();
  if (path === 'admin') return pageAdmin();
  if (path.startsWith('scholarship/')) return pageDetails(path.split('/')[1]);
  return `<div class="empty-state" style="padding:100px 20px;"><h3>Page not found</h3><a href="#/" class="btn btn-primary btn-sm">Go home</a></div>`;
}

    ${!isAdminPage ? footerHtml() : ''}
    ${themeToggleHtml()}
    ${shouldShowGate ? gatePopupHtml() : ''}
  `;
  attachHandlers();
}

/* ---------------- Event wiring (re-attached after every render) ---------------- */
function attachHandlers() {
  // Mobile menu toggle
  const menuToggle = document.getElementById('menuToggle');
  const mainNav = document.getElementById('mainNav');
  if (menuToggle) menuToggle.addEventListener('click', () => mainNav.classList.toggle('open'));

  // Theme toggle
  const themeToggle = document.getElementById('themeToggle');
  if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

  // Category dropdown
  const catDrop = document.getElementById('catDrop');
  if (catDrop) {
    const btn = catDrop.querySelector('button');
    btn.addEventListener('click', (e) => { e.stopPropagation(); catDrop.classList.toggle('open'); });
    document.addEventListener('click', () => catDrop.classList.remove('open'), { once: true });
  }

  // Sign out
  const signOutBtn = document.getElementById('signOutBtn');
  if (signOutBtn) signOutBtn.addEventListener('click', async () => { await signOut(auth); location.hash = '#/'; });

  // Sign-in page
  const googleBtn = document.getElementById('googleSignIn');
  if (googleBtn) googleBtn.addEventListener('click', async () => {
    const msg = document.getElementById('authMsg');
    try {
      await signInWithPopup(auth, googleProvider);
      location.hash = '#/';
    } catch (err) {
      msg.innerHTML = `<div class="form-msg err">${esc(err.message)}</div>`;
    }
  });
  const emailForm = document.getElementById('emailSignInForm');
  if (emailForm) emailForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('authMsg');
    const fd = new FormData(emailForm);
    try {
      await signInWithEmailAndPassword(auth, fd.get('email'), fd.get('password'));
      location.hash = '#/';
    } catch (err) {
      msg.innerHTML = `<div class="form-msg err">${esc(err.message)}</div>`;
    }
  });
  const createBtn = document.getElementById('createAccountBtn');
  if (createBtn) createBtn.addEventListener('click', async () => {
    const msg = document.getElementById('authMsg');
    const fd = new FormData(emailForm);
    if (!fd.get('email') || !fd.get('password')) {
      msg.innerHTML = `<div class="form-msg err">Enter an email and password first.</div>`;
      return;
    }
    try {
      await createUserWithEmailAndPassword(auth, fd.get('email'), fd.get('password'));
      location.hash = '#/';
    } catch (err) {
      msg.innerHTML = `<div class="form-msg err">${esc(err.message)}</div>`;
    }
  });

  // Gate popup (shown over gated pages for signed-out visitors)
  const gatePopup = document.getElementById('gatePopup');
  if (gatePopup) {
    const dismissGate = () => { state.gateDismissed = true; render(); };
    const gateClose = document.getElementById('gateClose');
    if (gateClose) gateClose.addEventListener('click', dismissGate);
    const gateContinueGuest = document.getElementById('gateContinueGuest');
    if (gateContinueGuest) gateContinueGuest.addEventListener('click', dismissGate);
    // Clicking the dark backdrop itself (not the card) also dismisses
    gatePopup.addEventListener('click', (e) => { if (e.target === gatePopup) dismissGate(); });

    const gateGoogleBtn = document.getElementById('gateGoogleSignIn');
    if (gateGoogleBtn) gateGoogleBtn.addEventListener('click', async () => {
      const msg = document.getElementById('gateAuthMsg');
      try {
        await signInWithPopup(auth, googleProvider);
        state.gateDismissed = true;
      } catch (err) {
        msg.innerHTML = `<div class="form-msg err">${esc(err.message)}</div>`;
      }
    });
    const gateEmailForm = document.getElementById('gateEmailForm');
    if (gateEmailForm) gateEmailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('gateAuthMsg');
      const fd = new FormData(gateEmailForm);
      try {
        await signInWithEmailAndPassword(auth, fd.get('email'), fd.get('password'));
        state.gateDismissed = true;
      } catch (err) {
        msg.innerHTML = `<div class="form-msg err">${esc(err.message)}</div>`;
      }
    });
    const gateCreateBtn = document.getElementById('gateCreateAccountBtn');
    if (gateCreateBtn) gateCreateBtn.addEventListener('click', async () => {
      const msg = document.getElementById('gateAuthMsg');
      const fd = new FormData(gateEmailForm);
      if (!fd.get('email') || !fd.get('password')) {
        msg.innerHTML = `<div class="form-msg err">Enter an email and password first.</div>`;
        return;
      }
      try {
        await createUserWithEmailAndPassword(auth, fd.get('email'), fd.get('password'));
        state.gateDismissed = true;
      } catch (err) {
        msg.innerHTML = `<div class="form-msg err">${esc(err.message)}</div>`;
      }
    });
  }

  // Search page
  const searchForm = document.getElementById('searchForm');
  if (searchForm) searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = document.getElementById('searchInput').value.trim();
    location.hash = `#/search?q=${encodeURIComponent(val)}`;
  });

  // Contact form (no backend wired — shows confirmation only)
  const contactForm = document.getElementById('contactForm');
  if (contactForm) contactForm.addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('contactMsg').innerHTML = `<div class="form-msg ok">Thanks — your message has been noted. We'll get back to you by email.</div>`;
    contactForm.reset();
  });

  // Admin: tab switching
  document.querySelectorAll('.admin-side button[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.adminTab = btn.dataset.tab;
      state.editingId = null;
      render();
    });
  });
  const newBtn = document.getElementById('newScholarshipBtn');
  if (newBtn) newBtn.addEventListener('click', () => { state.adminTab = 'add'; state.editingId = null; render(); });
  const backBtn = document.getElementById('backToDashboard');
  if (backBtn) backBtn.addEventListener('click', () => { state.adminTab = 'dashboard'; render(); });
  const cancelBtn = document.getElementById('cancelFormBtn');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { state.adminTab = 'dashboard'; state.editingId = null; render(); });

  // Admin: table actions
  document.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
    state.editingId = btn.dataset.edit;
    state.adminTab = 'add';
    render();
  }));
  document.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('Delete this scholarship? This can\'t be undone.')) return;
    try { await deleteDoc(doc(db, 'scholarships', btn.dataset.delete)); }
    catch (err) { alert('Delete failed: ' + err.message); }
  }));
  document.querySelectorAll('[data-toggle-verify]').forEach(btn => btn.addEventListener('click', async () => {
    const s = state.scholarships.find(x => x.id === btn.dataset.toggleVerify);
    try { await updateDoc(doc(db, 'scholarships', s.id), { verified: !s.verified }); }
    catch (err) { alert('Update failed: ' + err.message); }
  }));
  document.querySelectorAll('[data-toggle-publish]').forEach(btn => btn.addEventListener('click', async () => {
    const s = state.scholarships.find(x => x.id === btn.dataset.togglePublish);
    try { await updateDoc(doc(db, 'scholarships', s.id), { published: s.published === false ? true : false }); }
    catch (err) { alert('Update failed: ' + err.message); }
  }));

  // Admin: add/edit form submit
  const schForm = document.getElementById('scholarshipForm');
  if (schForm) schForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('adminFormMsg');
    const fd = new FormData(schForm);
    const id = fd.get('_id');
    const submitBtn = schForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';

    try {
      let imageUrl = id ? (state.scholarships.find(s => s.id === id)?.image || '') : '';
      const file = fd.get('image');
      if (file && file.size > 0) {
        const path = `scholarship-images/${Date.now()}-${file.name}`;
        const storageRef = ref(storage, path);
        await uploadBytes(storageRef, file);
        imageUrl = await getDownloadURL(storageRef);
      }

      const deadlineStr = fd.get('deadline');
      const payload = {
        title: fd.get('title') || '',
        country: fd.get('country') || '',
        degree: fd.get('degree') || '',
        funding: fd.get('funding') || '',
        deadline: deadlineStr ? Timestamp.fromDate(new Date(deadlineStr + 'T00:00:00')) : null,
        description: fd.get('description') || '',
        eligibility: (fd.get('eligibility') || '').split('\n').map(s => s.trim()).filter(Boolean),
        documents: (fd.get('documents') || '').split('\n').map(s => s.trim()).filter(Boolean),
        howToApply: fd.get('howToApply') || '',
        applicationLink: fd.get('applicationLink') || '',
        officialWebsite: fd.get('officialWebsite') || '',
        source: fd.get('source') || '',
        image: imageUrl,
        tags: (fd.get('tags') || '').split(',').map(s => s.trim()).filter(Boolean),
        verified: fd.get('verified') === 'on',
        published: fd.get('published') === 'on',
      };

      if (id) {
        await updateDoc(doc(db, 'scholarships', id), payload);
      } else {
        payload.createdAt = serverTimestamp();
        await addDoc(collection(db, 'scholarships'), payload);
      }
      state.adminTab = 'dashboard';
      state.editingId = null;
      render();
    } catch (err) {
      msg.innerHTML = `<div class="form-msg err">${esc(err.message)}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = id ? 'Save changes' : 'Add scholarship';
    }
  });
}

render();
</script>
</body>
</html>
