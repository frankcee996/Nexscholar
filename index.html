<style>
  :root {
    --indigo: #1B2A4A;
    --indigo-deep: #101B33;
    --gold: #C9A24B;
    --gold-soft: #E4CE95;
    --paper: #F7F5F0;
    --paper-raised: #FFFFFF;
    --slate: #4A5568;
    --slate-light: #8A93A3;
    --urgent: #B34A4A;
    --urgent-soft: #F3DEDE;
    --line: #E2DED3;
    --font-display: 'Source Serif 4', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 14px;
    --shadow-card: 0 1px 2px rgba(27,42,74,0.06), 0 4px 16px rgba(27,42,74,0.06);
    --shadow-raised: 0 8px 30px rgba(27,42,74,0.14);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
  body { margin: 0; font-family: var(--font-body); color: var(--indigo); background: var(--paper); -webkit-font-smoothing: antialiased; }
  h1,h2,h3,h4 { font-family: var(--font-display); margin: 0; font-weight: 600; color: var(--indigo-deep); line-height: 1.15; }
  p { margin: 0; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  button { font-family: var(--font-body); cursor: pointer; }
  input, select, textarea { font-family: var(--font-body); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  img { max-width: 100%; display: block; }

  .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
  .mono { font-family: var(--font-mono); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: var(--radius-md); font-weight: 600; font-size: 0.95rem; border: 1px solid transparent; transition: transform .15s ease, background .15s ease, border-color .15s ease; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--indigo); color: var(--paper); }
  .btn-primary:hover { background: var(--indigo-deep); }
  .btn-gold { background: var(--gold); color: var(--indigo-deep); }
  .btn-gold:hover { background: #b8912f; }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--indigo); }
  .btn-ghost:hover { border-color: var(--indigo); }
  .btn-danger { background: transparent; border-color: var(--urgent); color: var(--urgent); }
  .btn-danger:hover { background: var(--urgent-soft); }
  .btn-sm { padding: 8px 14px; font-size: 0.85rem; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

  .pill { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em; background: var(--paper); border: 1px solid var(--line); color: var(--slate); }
  .eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); font-weight: 600; }

  /* ---- Header ---- */
  header.site { position: sticky; top: 0; z-index: 50; background: rgba(247,245,240,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .nav-wrap { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; max-width: 1160px; margin: 0 auto; gap: 16px; }

  nav.main-links a:hover, nav.main-links a.active, .nav-drop > button:hover { color: var(--indigo); background: rgba(27,42,74,0.06); }

  .nav-drop-menu a:hover { background: var(--paper); color: var(--indigo); }
  .menu-toggle { display: none; background: none; border: none; padding: 8px; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--slate); }

  @media (max-width: 900px) {
    nav.main-links { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--paper-raised); border-bottom: 1px solid var(--line); flex-direction: column; align-items: stretch; padding: 8px; box-shadow: var(--shadow-raised); }

  /* ---- Hero ---- */
  .hero { padding: 72px 24px 56px; position: relative; overflow: hidden; }
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -1;

      radial-gradient(circle at 10% 90%, rgba(27,42,74,0.06), transparent 40%);

  .hero-inner { max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: center; }
  @media (max-width: 900px) { .hero-inner { grid-template-columns: 1fr; gap: 32px; } }
  .hero h1 { font-size: clamp(2.1rem, 4.2vw, 3.2rem); letter-spacing: -0.01em; }
  .hero .lede { margin-top: 18px; font-size: 1.08rem; color: var(--slate); max-width: 46ch; }
  .hero-cta { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
  .hero-stats { display: flex; gap: 32px; margin-top: 44px; }

  .hero-stat .label { font-size: 0.82rem; color: var(--slate-light); margin-top: 2px; }

  /* Deadline clock visual — the hero thesis */
  .clock-panel { background: var(--indigo-deep); border-radius: var(--radius-lg); padding: 32px; color: var(--paper); box-shadow: var(--shadow-raised); }

  .clock-list { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
  .clock-row { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid rgba(247,245,240,0.12); }
  .clock-row:last-child { border-bottom: none; padding-bottom: 0; }
  .clock-row .title { font-size: 0.92rem; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clock-row .days { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: rgba(201,162,75,0.18); color: var(--gold-soft); white-space: nowrap; }
  .clock-row .days.soon { background: rgba(179,74,74,0.25); color: #f0b8b8; }

  /* ---- Section shells ---- */
  section.block { padding: 56px 24px; }
  .block-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
  .block-head h2 { font-size: 1.7rem; }
  .block-head .sub { color: var(--slate); margin-top: 6px; font-size: 0.95rem; }

  /* ---- Scholarship card (signature: deadline drain bar) ---- */
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card {
    position: relative; background: var(--paper-raised); border-radius: var(--radius-md);
    box-shadow: var(--shadow-card); overflow: hidden; padding: 22px 22px 22px 26px;
    display: flex; flex-direction: column; gap: 12px; transition: transform .15s ease, box-shadow .15s ease;
    border: 1px solid var(--line);
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-raised); }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: var(--line);
  }
  .card::after {
    content: ""; position: absolute; left: 0; bottom: 0; width: 5px;
    background: var(--gold); height: var(--fill, 40%);
    transition: height .3s ease;
  }
  .card.urgent::after { background: var(--urgent); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .card h3 { font-size: 1.12rem; line-height: 1.3; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 0.85rem; color: var(--slate); margin-top: 2px; }
  .card-meta span { display: flex; align-items: center; gap: 5px; }
  .card-deadline { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .card-deadline .date { font-family: var(--font-mono); font-size: 0.85rem; color: var(--indigo); }
  .card-deadline .days-left { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 600; color: var(--gold); }
  .card-deadline .days-left.soon { color: var(--urgent); }
  .card-link { position: absolute; inset: 0; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--slate); }
  .empty-state h3 { color: var(--slate); font-size: 1.1rem; margin-bottom: 8px; }
  .loading-state { text-align: center; padding: 60px 20px; color: var(--slate-light); font-family: var(--font-mono); font-size: 0.9rem; }

  /* ---- Filters / search ---- */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 26px; align-items: center; }
  .filter-bar select, .filter-bar input[type="text"] {
    padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--line);
    background: var(--paper-raised); font-size: 0.88rem; color: var(--indigo);
  }
  .filter-bar input[type="text"] { flex: 1; min-width: 220px; }
  .filter-chip { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper-raised); font-size: 0.85rem; color: var(--slate); }
  .filter-chip.active { background: var(--indigo); color: var(--paper); border-color: var(--indigo); }

  /* ---- Category tiles ---- */
  .grid-categories { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .cat-tile { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 22px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s ease, transform .15s ease; }
  .cat-tile:hover { border-color: var(--gold); transform: translateY(-2px); }
  .cat-tile .icon { width: 38px; height: 38px; border-radius: 9px; background: var(--paper); display: flex; align-items: center; justify-content: center; color: var(--indigo); }
  .cat-tile h3 { font-size: 1.05rem; }
  .cat-tile p { font-size: 0.85rem; color: var(--slate); }

  /* ---- Details page ---- */
  .details-hero { background: var(--indigo-deep); color: var(--paper); padding: 48px 24px; }
  .details-hero .container { max-width: 900px; }
  .details-hero h1 { color: var(--paper); font-size: clamp(1.6rem, 3.4vw, 2.3rem); }
  .details-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .details-badges .pill { background: rgba(247,245,240,0.1); border-color: rgba(247,245,240,0.2); color: var(--gold-soft); }
  .details-meta-row { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 22px; }
  .details-meta-row .item .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--slate-light); }
  .details-meta-row .item .value { font-family: var(--font-mono); font-size: 0.98rem; margin-top: 3px; }

  .details-body { max-width: 900px; margin: 0 auto; padding: 44px 24px 80px; display: grid; grid-template-columns: 1fr 300px; gap: 44px; }
  @media (max-width: 800px) { .details-body { grid-template-columns: 1fr; } }
  .details-section { margin-bottom: 34px; }
  .details-section h2 { font-size: 1.15rem; margin-bottom: 12px; }
  .details-section p, .details-section li { color: var(--slate); font-size: 0.96rem; }
  .details-section ul { padding-left: 20px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .details-side { align-self: start; position: sticky; top: 90px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .details-side .btn { width: 100%; }
  .side-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .side-row:last-of-type { border-bottom: none; padding-bottom: 0; }
  .side-row .k { color: var(--slate-light); }
  .side-row .v { font-weight: 500; }

  /* ---- Footer ---- */
  footer.site { background: var(--indigo-deep); color: var(--paper); padding: 48px 24px 28px; margin-top: 40px; }
  .footer-grid { max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; }
  @media (max-width: 700px) { .footer-grid { grid-template-columns: 1fr; } }
  footer.site h4 { color: var(--paper); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; font-family: var(--font-body); font-weight: 600; }
  footer.site .brand { color: var(--paper); }
  footer.site p.tag { color: rgba(247,245,240,0.6); font-size: 0.88rem; margin-top: 12px; max-width: 34ch; }
  footer.site ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 9px; }
  footer.site a { color: rgba(247,245,240,0.75); font-size: 0.9rem; }
  footer.site a:hover { color: var(--gold-soft); }
  .footer-bottom { max-width: 1160px; margin: 36px auto 0; padding-top: 20px; border-top: 1px solid rgba(247,245,240,0.12); font-size: 0.8rem; color: rgba(247,245,240,0.5); }

  /* ---- Forms (contact / admin) ---- */
  .form-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 32px; max-width: 560px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .field label { font-size: 0.85rem; font-weight: 600; color: var(--indigo); }
  .field .hint { font-size: 0.78rem; color: var(--slate-light); }
  .field input, .field select, .field textarea {
    padding: 11px 13px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--paper); font-size: 0.92rem; color: var(--indigo);
  }
  .field textarea { resize: vertical; min-height: 90px; font-family: var(--font-body); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }
  .form-msg { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 16px; }
  .form-msg.ok { background: #DFF0E0; color: #2C6E31; }
  .form-msg.err { background: var(--urgent-soft); color: var(--urgent); }

  /* ---- Admin ---- */
  .admin-shell { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 73px); }
  @media (max-width: 800px) { .admin-shell { grid-template-columns: 1fr; } }
  .admin-side { background: var(--paper-raised); border-right: 1px solid var(--line); padding: 24px 14px; display: flex; flex-direction: column; gap: 4px; }
  .admin-side button { display: block; width: 100%; text-align: left; padding: 10px 14px; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--slate); font-size: 0.9rem; }
  .admin-side button.active, .admin-side button:hover { background: var(--indigo); color: var(--paper); }
  .admin-main { padding: 32px 28px; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  table.admin-table { width: 100%; border-collapse: collapse; background: var(--paper-raised); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
  table.admin-table th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate-light); padding: 12px 16px; border-bottom: 1px solid var(--line); }
  table.admin-table td { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 0.88rem; vertical-align: middle; }
  table.admin-table tr:last-child td { border-bottom: none; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.verified { background: #2C9E4A; }
  .status-dot.unverified { background: var(--slate-light); }
  .status-dot.draft { background: var(--gold); }
  .table-actions { display: flex; gap: 8px; }
  .table-actions button { background: none; border: none; color: var(--slate); font-size: 0.82rem; padding: 4px 8px; border-radius: 4px; }
  .table-actions button:hover { background: var(--paper); color: var(--indigo); }
  .table-actions button.danger:hover { color: var(--urgent); background: var(--urgent-soft); }

  .admin-login-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 18px; }
  .stat-card .num { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 600; color: var(--indigo-deep); }
  .stat-card .label { font-size: 0.8rem; color: var(--slate); margin-top: 4px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: 16px; height: 16px; }

  .page-fade { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .hidden { display: none !important; }
</style>

<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot,
  query, orderBy, serverTimestamp, Timestamp
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

/* ---------------- Firebase init ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyBF__ygq64sBVjhaS2448YWBHyfkr_W0HY",
  authDomain: "scholarix-d9c7c.firebaseapp.com",
  projectId: "scholarix-d9c7c",
  storageBucket: "scholarix-d9c7c.firebasestorage.app",
  messagingSenderId: "297659522394",
  appId: "1:297659522394:web:1dcb11a25cbe071de96763",
  measurementId: "G-E5NYT0DGS3"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();
const db = getFirestore(app);
const storage = getStorage(app);

const ADMIN_EMAILS = ['ceeenterprise385@gmail.com'];

/* ---------------- App state ---------------- */
const state = {
  route: parseHash(),
  scholarships: [],
  scholarshipsLoaded: false,
  user: null,
  authLoading: true,
  adminTab: 'dashboard',
  editingId: null,
};

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const params = new URLSearchParams(qs || '');
  return { path: path || '', params };
}

window.addEventListener('hashchange', () => {
  state.route = parseHash();
  render();
  window.scrollTo(0, 0);
});

/* ---------------- Firestore live subscription ---------------- */
const q = query(collection(db, 'scholarships'), orderBy('createdAt', 'desc'));
onSnapshot(q, (snap) => {
  state.scholarships = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  state.scholarshipsLoaded = true;
  render();
}, (err) => {
  console.error('Firestore error', err);
  state.scholarshipsLoaded = true;
  state.scholarshipsError = err.message;
  render();
});

onAuthStateChanged(auth, (u) => {
  state.user = u;
  state.authLoading = false;
  render();
});

function isAdmin() {
  return !!state.user && ADMIN_EMAILS.includes((state.user.email || '').toLowerCase());
}

/* ---------------- Helpers ---------------- */
function esc(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toDate(val) {
  if (!val) return null;
  if (val.toDate) return val.toDate();
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}

function daysUntil(deadline) {
  const d = toDate(deadline);
  if (!d) return null;
  const end = new Date(d); end.setHours(23,59,59,999);
  return Math.ceil((end - Date.now()) / 86400000);
}

function formatDate(deadline) {
  const d = toDate(deadline);
  if (!d) return 'No deadline listed';
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function fillPercent(days) {
  if (days === null) return 40;
  if (days <= 0) return 100;
  if (days >= 90) return 8;
  return Math.round(100 - (days / 90) * 92);
}

function slugTitle(s) {
  return esc(s.title || 'Untitled scholarship');
}

function cardHtml(s) {

  if (days === null) daysLabel = '';
  else if (days < 0) daysLabel = 'Closed';
  else if (days === 0) daysLabel = 'Closes today';
  else daysLabel = `${days}d left`;

  return `
  <div class="card ${urgent ? 'urgent' : ''}" style="--fill:${fill}%">
    <a class="card-link" href="#/scholarship/${s.id}" aria-label="${slugTitle(s)}"></a>

      ${s.country ? `<span>🌍 ${esc(s.country)}</span>` : ''}
      ${s.degree ? `<span>🎓 ${esc(s.degree)}</span>` : ''}

  return `<div class="grid-cards">${list.map(cardHtml).join('')}</div>`;

function filterBar(params) {
  const degree = params.get('degree') || '';
  const funding = params.get('funding') || '';
  const closing = params.get('closing') || '';
  function chip(label, active, href) {
    return `<a href="${href}" class="filter-chip ${active ? 'active' : ''}">${label}</a>`;
  }
  const base = (overrides) => {
    const p = new URLSearchParams(params);
    Object.entries(overrides).forEach(([k,v]) => v ? p.set(k,v) : p.delete(k));
    const s = p.toString();
    return `#/scholarships${s ? '?' + s : ''}`;
  };
  return `
  <div class="filter-bar">
    ${chip('All', !degree && !funding && !closing, '#/scholarships')}
    ${DEGREES.map(d => chip(d, degree===d, base({degree: degree===d?'':d}))).join('')}
    ${FUNDING.map(f => chip(f, funding===f, base({funding: funding===f?'':f}))).join('')}
    ${chip('Closing Soon', closing==='soon', base({closing: closing==='soon'?'':'soon'}))}
  </div>`;
}

function filterList(list, params) {
  const degree = params.get('degree');
  const funding = params.get('funding');
  const closing = params.get('closing');
  const country = params.get('country');
  return list.filter(s => {
    if (degree && s.degree !== degree) return false;
    if (funding && s.funding !== funding) return false;
    if (country && s.country !== country) return false;
    if (closing === 'soon') {
      const d = daysUntil(s.deadline);
      if (d === null || d < 0 || d > 14) return false;
    }
    return true;
  });
}

          <td>
            <div class="table-actions">
              <button data-edit="${s.id}">Edit</button>
              <button data-toggle-verify="${s.id}">${s.verified ? 'Unverify' : 'Verify'}</button>
              <button data-toggle-publish="${s.id}">${s.published===false ? 'Publish' : 'Unpublish'}</button>
              <button class="danger" data-delete="${s.id}">Delete</button>
            </div>
          </td>
        </tr>
      `).join('')}
    </tbody>
  </table>`;
}

function adminForm(editId) {
  const editing = editId ? state.scholarships.find(s => s.id === editId) : null;
  const v = (field, fallback='') => editing ? esc(editing[field] ?? fallback) : fallback;
  const arrJoin = (field) => editing && Array.isArray(editing[field]) ? esc(editing[field].join('\n')) : '';
  const deadlineVal = editing && editing.deadline ? (() => { const d = toDate(editing.deadline); return d ? d.toISOString().slice(0,10) : ''; })() : '';

  return `
  <div class="admin-header">
    <h2>${editing ? 'Edit scholarship' : 'Add scholarship'}</h2>
    <button class="btn btn-ghost btn-sm" id="backToDashboard">← Back to dashboard</button>
  </div>
  <div id="adminFormMsg"></div>
  <form id="scholarshipForm" class="form-card" style="max-width:680px;">
    <input type="hidden" name="_id" value="${editing ? editing.id : ''}" />
    <div class="field"><label>Title</label><input type="text" name="title" required value="${v('title')}" /></div>
    <div class="field-row">
      <div class="field"><label>Country</label><input type="text" name="country" value="${v('country')}" /></div>
      <div class="field"><label>Degree level</label>
        <select name="degree">
          <option value="">Select…</option>
          ${DEGREES.map(d => `<option value="${d}" ${editing && editing.degree===d ? 'selected':''}>${d}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Deadline</label><input type="date" name="deadline" value="${deadlineVal}" /></div>
      <div class="field"><label>Funding type</label>
        <select name="funding">
          <option value="">Select…</option>
          ${FUNDING.map(f => `<option value="${f}" ${editing && editing.funding===f ? 'selected':''}>${f}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="field"><label>Description</label><textarea name="description">${v('description')}</textarea></div>
    <div class="field"><label>Eligibility <span class="hint">(one item per line)</span></label><textarea name="eligibility">${arrJoin('eligibility') || v('eligibility')}</textarea></div>
    <div class="field"><label>Required documents <span class="hint">(one item per line)</span></label><textarea name="documents">${arrJoin('documents') || v('documents')}</textarea></div>
    <div class="field"><label>How to apply</label><textarea name="howToApply">${v('howToApply')}</textarea></div>
    <div class="field"><label>Official application link</label><input type="url" name="applicationLink" value="${v('applicationLink')}" placeholder="https://…" /></div>
    <div class="field"><label>Official website</label><input type="url" name="officialWebsite" value="${v('officialWebsite')}" placeholder="https://…" /></div>
    <div class="field"><label>Source</label><input type="text" name="source" value="${v('source')}" placeholder="e.g. University of Toronto" /></div>
    <div class="field"><label>Image</label><input type="file" name="image" accept="image/*" />
      ${editing && editing.image ? `<img src="${esc(editing.image)}" alt="" style="margin-top:10px;max-width:180px;border-radius:8px;" />` : ''}
    </div>
    <div class="field"><label>Tags <span class="hint">(comma separated)</span></label><input type="text" name="tags" value="${editing && Array.isArray(editing.tags) ? esc(editing.tags.join(', ')) : v('tags')}" /></div>
    <div class="field checkbox-row"><input type="checkbox" name="verified" id="verifiedCheck" ${editing && editing.verified ? 'checked':''} /><label for="verifiedCheck" style="margin:0;">Mark as verified</label></div>
    <div class="field checkbox-row"><input type="checkbox" name="published" id="publishedCheck" ${!editing || editing.published !== false ? 'checked':''} /><label for="publishedCheck" style="margin:0;">Published (visible on the public site)</label></div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-primary" type="submit">${editing ? 'Save changes' : 'Add scholarship'}</button>
      <button class="btn btn-ghost" type="button" id="cancelFormBtn">Cancel</button>
    </div>
  </form>`;
}

/* ---------------- Router / render ---------------- */
function currentPageHtml() {
  const { path } = state.route;
  if (path === '' ) return pageHome();
  if (path === 'scholarships') return pageScholarships();
  if (path === 'search') return pageSearch();
  if (path === 'categories') return pageCategories();
  if (path === 'about') return pageAbout();
  if (path === 'contact') return pageContact();
  if (path === 'signin') return pageSignIn();
  if (path === 'admin') return pageAdmin();
  if (path.startsWith('scholarship/')) return pageDetails(path.split('/')[1]);
  return `<div class="empty-state" style="padding:100px 20px;"><h3>Page not found</h3><a href="#/" class="btn btn-primary btn-sm">Go home</a></div>`;
}

function render() {
  const isAdminPage = state.route.path === 'admin';
  document.getElementById('app').innerHTML = `
    ${navHtml()}
    <main>${currentPageHtml()}</main>
    ${!isAdminPage ? footerHtml() : ''}
  `;
  attachHandlers();
}

/* ---------------- Event wiring (re-attached after every render) ---------------- */
function attachHandlers() {
  // Mobile menu toggle
  const menuToggle = document.getElementById('menuToggle');
  const mainNav = document.getElementById('mainNav');
  if (menuToggle) menuToggle.addEventListener('click', () => mainNav.classList.toggle('open'));

  // Category dropdown
  const catDrop = document.getElementById('catDrop');
  if (catDrop) {
    const btn = catDrop.querySelector('button');
    btn.addEventListener('click', (e) => { e.stopPropagation(); catDrop.classList.toggle('open'); });
    document.addEventListener('click', () => catDrop.classList.remove('open'), { once: true });
  }

  // Sign out
  const signOutBtn = document.getElementById('signOutBtn');
  if (signOutBtn) signOutBtn.addEventListener('click', async () => { await signOut(auth); location.hash = '#/'; });

  // Sign-in page
  const googleBtn = document.getElementById('googleSignIn');
  if (googleBtn) googleBtn.addEventListener('click', async () => {
    const msg = document.getElementById('authMsg');
    try {
      await signInWithPopup(auth, googleProvider);
      location.hash = '#/';
    } catch (err) {
      msg.innerHTML = `<div class="form-msg err">${esc(err.message)}</div>`;
    }
  });
  const emailForm = document.getElementById('emailSignInForm');
  if (emailForm) emailForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('authMsg');
    const fd = new FormData(emailForm);
    try {
      await signInWithEmailAndPassword(auth, fd.get('email'), fd.get('password'));
      location.hash = '#/';
    } catch (err) {
      msg.innerHTML = `<div class="form-msg err">${esc(err.message)}</div>`;
    }
  });
  const createBtn = document.getElementById('createAccountBtn');
  if (createBtn) createBtn.addEventListener('click', async () => {
    const msg = document.getElementById('authMsg');
    const fd = new FormData(emailForm);
    if (!fd.get('email') || !fd.get('password')) {
      msg.innerHTML = `<div class="form-msg err">Enter an email and password first.</div>`;
      return;
    }
    try {
      await createUserWithEmailAndPassword(auth, fd.get('email'), fd.get('password'));
      location.hash = '#/';
    } catch (err) {
      msg.innerHTML = `<div class="form-msg err">${esc(err.message)}</div>`;
    }
  });

  // Search page
  const searchForm = document.getElementById('searchForm');
  if (searchForm) searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = document.getElementById('searchInput').value.trim();
    location.hash = `#/search?q=${encodeURIComponent(val)}`;
  });

  // Contact form (no backend wired — shows confirmation only)
  const contactForm = document.getElementById('contactForm');
  if (contactForm) contactForm.addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('contactMsg').innerHTML = `<div class="form-msg ok">Thanks — your message has been noted. We'll get back to you by email.</div>`;
    contactForm.reset();
  });

  // Admin: tab switching
  document.querySelectorAll('.admin-side button[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.adminTab = btn.dataset.tab;
      state.editingId = null;
      render();
    });
  });
  const newBtn = document.getElementById('newScholarshipBtn');
  if (newBtn) newBtn.addEventListener('click', () => { state.adminTab = 'add'; state.editingId = null; render(); });
  const backBtn = document.getElementById('backToDashboard');
  if (backBtn) backBtn.addEventListener('click', () => { state.adminTab = 'dashboard'; render(); });
  const cancelBtn = document.getElementById('cancelFormBtn');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { state.adminTab = 'dashboard'; state.editingId = null; render(); });

  // Admin: table actions
  document.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
    state.editingId = btn.dataset.edit;
    state.adminTab = 'add';
    render();
  }));
  document.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('Delete this scholarship? This can\'t be undone.')) return;
    try { await deleteDoc(doc(db, 'scholarships', btn.dataset.delete)); }
    catch (err) { alert('Delete failed: ' + err.message); }
  }));
  document.querySelectorAll('[data-toggle-verify]').forEach(btn => btn.addEventListener('click', async () => {
    const s = state.scholarships.find(x => x.id === btn.dataset.toggleVerify);
    try { await updateDoc(doc(db, 'scholarships', s.id), { verified: !s.verified }); }
    catch (err) { alert('Update failed: ' + err.message); }
  }));
  document.querySelectorAll('[data-toggle-publish]').forEach(btn => btn.addEventListener('click', async () => {
    const s = state.scholarships.find(x => x.id === btn.dataset.togglePublish);
    try { await updateDoc(doc(db, 'scholarships', s.id), { published: s.published === false ? true : false }); }
    catch (err) { alert('Update failed: ' + err.message); }
  }));

  // Admin: add/edit form submit
  const schForm = document.getElementById('scholarshipForm');
  if (schForm) schForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('adminFormMsg');
    const fd = new FormData(schForm);
    const id = fd.get('_id');
    const submitBtn = schForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';

    try {
      let imageUrl = id ? (state.scholarships.find(s => s.id === id)?.image || '') : '';
      const file = fd.get('image');
      if (file && file.size > 0) {
        const path = `scholarship-images/${Date.now()}-${file.name}`;
        const storageRef = ref(storage, path);
        await uploadBytes(storageRef, file);
        imageUrl = await getDownloadURL(storageRef);
      }

      const deadlineStr = fd.get('deadline');
      const payload = {
        title: fd.get('title') || '',
        country: fd.get('country') || '',
        degree: fd.get('degree') || '',
        funding: fd.get('funding') || '',
        deadline: deadlineStr ? Timestamp.fromDate(new Date(deadlineStr + 'T00:00:00')) : null,
        description: fd.get('description') || '',
        eligibility: (fd.get('eligibility') || '').split('\n').map(s => s.trim()).filter(Boolean),
        documents: (fd.get('documents') || '').split('\n').map(s => s.trim()).filter(Boolean),
        howToApply: fd.get('howToApply') || '',
        applicationLink: fd.get('applicationLink') || '',
        officialWebsite: fd.get('officialWebsite') || '',
        source: fd.get('source') || '',
        image: imageUrl,
        tags: (fd.get('tags') || '').split(',').map(s => s.trim()).filter(Boolean),
        verified: fd.get('verified') === 'on',
        published: fd.get('published') === 'on',
      };

      if (id) {
        await updateDoc(doc(db, 'scholarships', id), payload);
      } else {
        payload.createdAt = serverTimestamp();
        await addDoc(collection(db, 'scholarships'), payload);
      }
      state.adminTab = 'dashboard';
      state.editingId = null;
      render();
    } catch (err) {
      msg.innerHTML = `<div class="form-msg err">${esc(err.message)}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = id ? 'Save changes' : 'Add scholarship';
    }
  });
}

render();
</script>
</body>
</html>
